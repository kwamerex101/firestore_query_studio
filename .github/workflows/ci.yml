name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile keeps CI honest if pnpm-lock.yaml drifts.
        # Electron binaries are skipped to keep installs fast — we don't
        # launch Electron in CI, only run type checks and unit tests.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Covers the shared planner / executor / profile validators so both
        # the Electron and web builds regress together. The web-transport
        # modules (IndexedDB / Firebase Web SDK) are bundle-checked by the
        # separate `web-build` job below — Vitest runs in jsdom without a
        # browser, so we keep those untested here.
        run: pnpm test

  web-build:
    name: Web / PWA build
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build web/PWA bundle
        # Ensures `vite.config.web.ts` still resolves, the shared planner
        # stays tree-shakable without Node deps, and the service worker
        # precache stays below the size budget.
        run: pnpm build:web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/web
          retention-days: 7
